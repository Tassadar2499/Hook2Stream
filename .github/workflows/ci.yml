name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17.10-alpine3.24
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      HOOK2STREAM_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=postgres;Username=postgres;Password=postgres
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Build audited MinIO acceptance dependency
        run: docker build --file src/deploy/minio/Dockerfile --tag hook2stream-minio:ci .

      - name: Start and verify MinIO/Caddy acceptance dependency
        run: src/ci/start-minio-acceptance.sh "$GITHUB_ENV"

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/*.csproj"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: dotnet restore src/Hook2Stream.slnx
      - run: npm ci --prefix src/web
      - run: npm audit --prefix src/web --omit=dev --audit-level=high
      - name: Validate production deployment bundle
        run: src/deploy/scripts/validate-deployment.sh
      - name: Validate release candidate contracts
        run: |
          bash src/ci/tests/release-candidate.test.sh
          node src/ci/tests/workflow-contract.test.mjs
      - run: src/ci/verify.sh

      - run: npx --prefix src/web playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e:fast --prefix src/web

      - name: Dump MinIO acceptance logs on failure
        if: failure()
        run: |
          docker logs hook2stream-ci-minio || true
          docker logs hook2stream-ci-caddy || true

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-fast
          path: |
            src/web/playwright-report/fast
            src/web/test-results/fast
          if-no-files-found: ignore
          retention-days: 14

  full-stack:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.302
          cache: true
          cache-dependency-path: "**/*.csproj"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - run: npm ci --prefix src/web
      - name: Install full-stack media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
      - run: npx --prefix src/web playwright install --with-deps chromium
      - run: src/ci/run-full-stack-e2e.sh

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-full-stack
          path: |
            src/web/playwright-report/full-stack
            src/web/test-results/full-stack
          if-no-files-found: ignore
          retention-days: 14

  containers:
    needs: [verify, full-stack]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/Hook2Stream.Api/Dockerfile
            runtime: dotnet
            secret_consumer: true
            build_args: ""
          - name: worker
            dockerfile: src/Hook2Stream.Worker/Dockerfile
            runtime: dotnet
            secret_consumer: true
            build_args: ""
          - name: bootstrapper
            dockerfile: src/Hook2Stream.Bootstrapper/Dockerfile
            runtime: dotnet
            secret_consumer: true
            build_args: ""
          - name: web
            dockerfile: src/web/Dockerfile
            runtime: node
            secret_consumer: false
            build_args: --build-arg NEXT_PUBLIC_AUTH_MODE=oauth
          - name: postgres-backup
            dockerfile: src/deploy/backup/Dockerfile
            runtime: postgres
            secret_consumer: true
            build_args: ""
          - name: minio
            dockerfile: src/deploy/minio/Dockerfile
            runtime: minio
            secret_consumer: false
            build_args: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build ${{ matrix.build_args }} --file "${{ matrix.dockerfile }}" --tag "hook2stream-${{ matrix.name }}:ci" .
      - if: matrix.runtime == 'dotnet'
        run: docker run --rm --entrypoint dotnet "hook2stream-${{ matrix.name }}:ci" --list-runtimes | grep -q Microsoft.AspNetCore.App
      - if: matrix.runtime == 'node'
        run: docker run --rm --entrypoint node "hook2stream-${{ matrix.name }}:ci" --version
      - if: matrix.runtime == 'postgres'
        run: docker run --rm --entrypoint pg_dump "hook2stream-${{ matrix.name }}:ci" --version
      - if: matrix.runtime == 'minio'
        run: docker run --rm --entrypoint minio "hook2stream-${{ matrix.name }}:ci" --version
      - name: Verify supplemental-group secret access
        if: matrix.secret_consumer == true
        shell: bash
        run: |
          probe_dir=$(mktemp -d)
          trap 'sudo rm -rf "$probe_dir"' EXIT
          printf '%s\n' 'runtime-secret-probe' | sudo tee "$probe_dir/secret" >/dev/null
          sudo chown root:2000 "$probe_dir/secret"
          sudo chmod 0640 "$probe_dir/secret"
          docker run --rm \
            --group-add 2000 \
            --mount "type=bind,source=$probe_dir/secret,target=/run/secrets/probe,readonly" \
            --entrypoint /bin/sh \
            "hook2stream-${{ matrix.name }}:ci" \
            -ec 'test -r /run/secrets/probe && test "$(cat /run/secrets/probe)" = runtime-secret-probe'
          if docker run --rm \
            --mount "type=bind,source=$probe_dir/secret,target=/run/secrets/probe,readonly" \
            --entrypoint /bin/sh \
            "hook2stream-${{ matrix.name }}:ci" \
            -ec 'test -r /run/secrets/probe' 2>/dev/null; then
            echo "runtime image can read the group-only secret without group_add" >&2
            exit 1
          fi
      - name: Scan container for high and critical vulnerabilities
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: hook2stream-${{ matrix.name }}:ci
          fail-build: true
          severity-cutoff: high
          output-format: table

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: containers
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            dockerfile: src/Hook2Stream.Api/Dockerfile
            build_args: ""
            deploy_var: API_IMAGE
          - name: worker
            dockerfile: src/Hook2Stream.Worker/Dockerfile
            build_args: ""
            deploy_var: WORKER_IMAGE
          - name: bootstrapper
            dockerfile: src/Hook2Stream.Bootstrapper/Dockerfile
            build_args: ""
            deploy_var: BOOTSTRAPPER_IMAGE
          - name: web
            dockerfile: src/web/Dockerfile
            build_args: NEXT_PUBLIC_AUTH_MODE=oauth
            deploy_var: WEB_IMAGE
          - name: postgres-backup
            dockerfile: src/deploy/backup/Dockerfile
            build_args: ""
            deploy_var: POSTGRES_BACKUP_IMAGE
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Resolve immutable image reference
        id: image
        shell: bash
        env:
          IMAGE_NAME: hook2stream-${{ matrix.name }}
        run: |
          repository="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "tag=${repository}:sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Publish immutable image with SBOM and provenance
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64
          tags: ${{ steps.image.outputs.tag }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=sha-${{ github.sha }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.name }}

      - name: Scan exact published digest
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.image.outputs.repository }}@${{ steps.build.outputs.digest }}
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Record digest-pinned release reference
        shell: bash
        env:
          IMAGE_NAME: ${{ matrix.name }}
          DEPLOY_VARIABLE: ${{ matrix.deploy_var }}
          IMAGE_REPOSITORY: ${{ steps.image.outputs.repository }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p release-digests
          echo "${DEPLOY_VARIABLE}=${IMAGE_REPOSITORY}@${IMAGE_DIGEST}" > "release-digests/${IMAGE_NAME}.txt"
          {
            echo "### ${IMAGE_NAME}"
            echo
            echo "\`${IMAGE_REPOSITORY}@${IMAGE_DIGEST}\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest reference
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-digest-${{ matrix.name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-digests/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 90

  runtime-images:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: caddy
            source: caddy:2.11.4-alpine
            deploy_var: CADDY_IMAGE
          - name: postgres
            source: postgres:17.10-alpine3.24
            deploy_var: POSTGRES_IMAGE
          - name: pgbouncer
            source: edoburu/pgbouncer:v1.25.2-p0
            deploy_var: PGBOUNCER_IMAGE
          - name: egress-proxy
            source: ubuntu/squid:6.6-24.04_edge
            deploy_var: EGRESS_PROXY_IMAGE
    steps:
      - name: Pull reviewed runtime image
        run: docker pull --platform linux/amd64 "${{ matrix.source }}"

      - name: Resolve exact runtime digest
        id: image
        shell: bash
        env:
          SOURCE_IMAGE: ${{ matrix.source }}
        run: |
          reference="$(docker image inspect --format '{{index .RepoDigests 0}}' "$SOURCE_IMAGE")"
          case "$reference" in
            *@sha256:????????????????????????????????????????????????????????????????) ;;
            *) echo "runtime image did not resolve to a sha256 digest" >&2; exit 1 ;;
          esac
          echo "reference=$reference" >> "$GITHUB_OUTPUT"

      - name: Scan exact runtime digest
        uses: anchore/scan-action@e1165082ffb1fe366ebaf02d8526e7c4989ea9d2 # v7.4.0
        with:
          image: ${{ steps.image.outputs.reference }}
          fail-build: true
          severity-cutoff: high
          output-format: table

      - name: Record runtime digest
        shell: bash
        env:
          DEPLOY_VARIABLE: ${{ matrix.deploy_var }}
          IMAGE_REFERENCE: ${{ steps.image.outputs.reference }}
        run: |
          mkdir -p release-digests
          printf '%s=%s\n' "$DEPLOY_VARIABLE" "$IMAGE_REFERENCE" > "release-digests/${{ matrix.name }}.txt"

      - name: Upload runtime digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-digest-${{ matrix.name }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-digests/${{ matrix.name }}.txt
          if-no-files-found: error
          retention-days: 90

  release-candidate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [publish, runtime-images]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    outputs:
      artifact-name: ${{ steps.identity.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download exact image digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-digest-*-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-digests
          merge-multiple: true

      - name: Set immutable candidate identity
        id: identity
        shell: bash
        run: |
          artifact_name="release-candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "artifact_name=$artifact_name" >> "$GITHUB_OUTPUT"

      - name: Assemble and validate release candidate
        run: |
          node src/ci/release-candidate.mjs create \
            --output release-candidate \
            --fragments release-digests \
            --deploy-dir src/deploy \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Sign candidate provenance
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-checksums: release-candidate/SHA256SUMS

      - name: Upload immutable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ${{ steps.identity.outputs.artifact_name }}
          path: release-candidate
          if-no-files-found: error
          retention-days: 90

  deploy-staging:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: staging
    concurrency:
      group: hook2stream-staging
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      CANDIDATE_NAME: ${{ needs.release-candidate.outputs.artifact-name }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: hook2stream-deploy
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Download release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ env.CANDIDATE_NAME }}
          path: release-candidate

      - name: Revalidate candidate before deployment
        run: |
          node src/ci/release-candidate.mjs validate \
            --candidate release-candidate \
            --repository "$GITHUB_REPOSITORY" \
            --sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Connect ephemeral staging runner to Tailscale
        uses: tailscale/github-action@780049a30b6ff5c378a9e7b389d15ece7a204888 # v4.1.3
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          audience: ${{ secrets.TS_AUDIENCE }}
          tags: tag:hook2stream-ci-staging
          ping: ${{ secrets.DEPLOY_HOST }}

      - name: Configure strict SSH identity
        shell: bash
        env:
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
        run: |
          install -d -m 0700 "$RUNNER_TEMP/hook2stream-ssh"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/hook2stream-ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$RUNNER_TEMP/hook2stream-ssh/known_hosts"
          chmod 0600 "$RUNNER_TEMP/hook2stream-ssh/id_ed25519" "$RUNNER_TEMP/hook2stream-ssh/known_hosts"
          ssh-keygen -y -f "$RUNNER_TEMP/hook2stream-ssh/id_ed25519" >/dev/null
          ssh-keygen -F "$DEPLOY_HOST" -f "$RUNNER_TEMP/hook2stream-ssh/known_hosts" >/dev/null

      - name: Deploy candidate and run host smoke/E2E
        shell: bash
        run: |
          mkdir -p transfer/candidate
          cp release-candidate/* transfer/candidate/
          tar -C transfer -cf - . | ssh \
            -i "$RUNNER_TEMP/hook2stream-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o "UserKnownHostsFile=$RUNNER_TEMP/hook2stream-ssh/known_hosts" \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "deploy $CANDIDATE_NAME" | tee "$RUNNER_TEMP/deploy-output.log"
          encoded_result="$(sed -n 's/^HOOK2STREAM_REMOTE_RECEIPT=//p' "$RUNNER_TEMP/deploy-output.log" | tail -n 1)"
          test -n "$encoded_result"
          printf '%s' "$encoded_result" | base64 --decode > remote-result.json

      - name: Create successful staging receipt
        run: |
          node src/ci/staging-receipt.mjs create \
            --candidate release-candidate \
            --remote-result remote-result.json \
            --output staging-receipt.json

      - name: Sign staging receipt for production host verification
        shell: bash
        env:
          STAGING_RECEIPT_SIGNING_KEY: ${{ secrets.STAGING_RECEIPT_SIGNING_KEY }}
        run: |
          printf '%s\n' "$STAGING_RECEIPT_SIGNING_KEY" > "$RUNNER_TEMP/staging-receipt-signing-key"
          chmod 0600 "$RUNNER_TEMP/staging-receipt-signing-key"
          ssh-keygen -Y sign \
            -f "$RUNNER_TEMP/staging-receipt-signing-key" \
            -n hook2stream-staging-receipt \
            staging-receipt.json
          mv staging-receipt.json.sig staging-receipt.sig

      - name: Sign staging receipt
        uses: actions/attest@a1948c3f048ba23858d222213b7c278aabede763 # v4.1.1
        with:
          subject-path: |
            staging-receipt.json
            staging-receipt.sig

      - name: Upload staging receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: staging-receipt-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            staging-receipt.json
            staging-receipt.sig
          if-no-files-found: error
          retention-days: 90
