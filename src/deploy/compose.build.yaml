services:
  api:
    build:
      context: ../..
      dockerfile: src/Hook2Stream.Api/Dockerfile
      args:
        DOTNET_SDK_VERSION: ${DOTNET_SDK_VERSION:-10.0.302}

  worker-media:
    build:
      context: ../..
      dockerfile: src/Hook2Stream.Worker/Dockerfile
      args:
        DOTNET_SDK_VERSION: ${DOTNET_SDK_VERSION:-10.0.302}

  bootstrapper:
    build:
      context: ../..
      dockerfile: src/Hook2Stream.Bootstrapper/Dockerfile
      args:
        DOTNET_SDK_VERSION: ${DOTNET_SDK_VERSION:-10.0.302}

  web:
    build:
      context: ../..
      dockerfile: src/web/Dockerfile
      args:
        NEXT_PUBLIC_AUTH_MODE: oauth

  postgres-backup:
    build:
      context: ../..
      dockerfile: src/deploy/backup/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-docker.io/library/postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}

  postgres:
    build:
      context: ../..
      dockerfile: src/deploy/postgres/Dockerfile
      args:
        POSTGRES_BASE_IMAGE: ${POSTGRES_BASE_IMAGE:-docker.io/library/postgres:17.11-alpine3.24@sha256:18cfe3ef5e6815560c98237d6216d1e5119702fb0f3894c8785dd58b8bbe5d73}
